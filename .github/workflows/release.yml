name: Release

# Equivalent to electron-builder's --publish=always on the "github" provider: pushing a version tag
# builds the app and publishes it as a GitHub Release, with tauri-action generating the `latest.json`
# manifest tauri-plugin-updater polls (see src-tauri/tauri.conf.json's plugins.updater.endpoints).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    # keyring's "windows-native" feature (src-tauri/Cargo.toml) and the vendored sidecars below are
    # Windows-only — this project doesn't build on other platforms yet.
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # src-tauri/binaries/ is gitignored (vendored executables, not source) — every build has to
      # fetch/produce these two sidecars itself. Mirrors the manual steps used to fix local dev.
      - name: Fetch opencode sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          npm install --prefix .opencode-fetch opencode-windows-x64@latest --no-save
          cp .opencode-fetch/node_modules/opencode-windows-x64/bin/opencode.exe \
             src-tauri/binaries/opencode-x86_64-pc-windows-msvc.exe

      - name: Build typer-mcp sidecar
        shell: bash
        run: |
          # tauri_build's build.rs refuses to compile this crate unless every externalBin path
          # already exists — seed a placeholder so `cargo build` can produce the real typer-mcp.exe,
          # then swap it in for the placeholder.
          cp src-tauri/binaries/opencode-x86_64-pc-windows-msvc.exe \
             src-tauri/binaries/typer-mcp-x86_64-pc-windows-msvc.exe
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin typer-mcp
          cp src-tauri/target/release/typer-mcp.exe \
             src-tauri/binaries/typer-mcp-x86_64-pc-windows-msvc.exe

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Generated locally with `tauri signer generate`; see the PR/setup notes for where the
          # private key file lives. The password secret is optional — this project's key has none.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Typer ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
